name: Publish GitHub release

# Creates the release from the files already in the repo, using the repo's own
# GITHUB_TOKEN. Runs on demand, and automatically on a push whose commit message
# contains "[release]" (so ordinary pushes never publish anything).
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.0
          TITLE: Endless Nightreign v1.0.0
          ASSET: EndlessNightreign-v1.0.0.zip
          NOTES: RELEASE-v1.0.0.md
        run: |
          set -euo pipefail
          ls -l "$ASSET" "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - refreshing its assets and notes."
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES"
            gh release upload "$TAG" "$ASSET" --clobber
          else
            echo "Creating release $TAG at $GITHUB_SHA"
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES"
          fi
          gh release view "$TAG" --json url,name,tagName,assets
